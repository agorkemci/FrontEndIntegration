<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create News Article</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    
                    <div class="mb-4 border-bottom pb-3">
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <i class="bi bi-newspaper fs-3 text-primary"></i>
                            <h2 class="fw-bold mb-0">Create News Article</h2>
                        </div>
                        <p class="text-muted mb-0">Fill in the fields below to publish or draft a new article.</p>
                    </div>

                    <!-- Bildirim Alanı (Hata / Başarı) -->
                    <div id="alert-container"></div>

                    <!-- Form gönderimi değil, doğrudan buton tıklamasıyla payload toplanır -->
                    <form id="create-news-form">
                        <input type="hidden" id="id" value="0">

                        <div class="row g-3">

                            <!-- 1. Title -->
                            <div class="col-12">
                                <label for="title" class="form-label fw-semibold">
                                    Title <span class="text-danger">*</span>
                                </label>
                                <input type="text" 
                                       class="form-control form-control-lg" 
                                       id="title" 
                                       maxlength="200" 
                                       placeholder="e.g. Major Breakthrough in AI Technology">
                                <div class="form-text">Max 200 characters. Keep it engaging and concise.</div>
                            </div>

                            <!-- 2. Slug (URL Identifier) -->
                            <div class="col-12">
                                <label for="slug" class="form-label fw-semibold">
                                    Slug (URL) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted">/news/</span>
                                    <input type="text" 
                                           class="form-control" 
                                           id="slug" 
                                           maxlength="222" 
                                           placeholder="major-breakthrough-in-ai">
                                </div>
                            </div>

                            <!-- 3. Author Name -->
                            <div class="col-md-6">
                                <label for="authorName" class="form-label fw-semibold">
                                    Author Name <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" 
                                           class="form-control" 
                                           id="authorName" 
                                           maxlength="100" 
                                           placeholder="e.g. Sarah Jenkins">
                                </div>
                            </div>

                            <!-- 4. Status (Enum: 0=Draft, 1=Published, 2=Archived) -->
                            <div class="col-md-6">
                                <label for="status" class="form-label fw-semibold">
                                    Status <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="status">
                                    <option value="0" selected>Draft</option>
                                    <option value="1">Published</option>
                                    <option value="2">Archived</option>
                                </select>
                            </div>

                            <!-- 5. Published At -->
                            <div class="col-12">
                                <label for="publishedAt" class="form-label fw-semibold">
                                    Publish Date & Time <span class="text-muted fw-normal">(Optional)</span>
                                </label>
                                <input type="datetime-local" 
                                       class="form-control" 
                                       id="publishedAt">
                                <div class="form-text">Leave blank to keep it unscheduled.</div>
                            </div>

                            <!-- 6. Summary -->
                            <div class="col-12">
                                <label for="summary" class="form-label fw-semibold">
                                    Summary / Teaser <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" 
                                          id="summary" 
                                          rows="3" 
                                          maxlength="500" 
                                          placeholder="Write a short spotlight summary to show on index cards..."></textarea>
                            </div>

                            <!-- 7. Content -->
                            <div class="col-12">
                                <label for="content" class="form-label fw-semibold">
                                    Full Content <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control font-monospace" 
                                          id="content" 
                                          rows="8" 
                                          placeholder="Write the full body content here (HTML supported)..."></textarea>
                            </div>

                            <!-- Butonlar (type="button" ile sayfa yenilenmesi engellenir) -->
                            <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                                <a href="index.html" class="btn btn-outline-secondary px-4">
                                    Cancel
                                </a>
                                <button type="button" id="btn-save" class="btn btn-primary px-4 fw-medium shadow-sm">
                                    <span id="submit-spinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
                                    <i id="submit-icon" class="bi bi-check2-circle me-1"></i>
                                    <span id="submit-text">Save Article</span>
                                </button>
                            </div>

                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btnSave = document.getElementById("btn-save");
            const alertContainer = document.getElementById("alert-container");
            const submitSpinner = document.getElementById("submit-spinner");
            const submitIcon = document.getElementById("submit-icon");
            const submitText = document.getElementById("submit-text");

            // Başlık yazıldıkça otomatik slug oluşturan yardımcı
            const titleInput = document.getElementById("title");
            const slugInput = document.getElementById("slug");
            titleInput.addEventListener("input", () => {
                if (!slugInput.dataset.touched) {
                    slugInput.value = titleInput.value
                        .toLowerCase()
                        .trim()
                        .replace(/[^a-z0-9\s-]/g, '')
                        .replace(/\s+/g, '-');
                }
            });
            slugInput.addEventListener("input", () => {
                slugInput.dataset.touched = "true";
            });

            // Butona tıklandığında payload üretilip gönderilir
            btnSave.addEventListener("click", async () => {
                alertContainer.innerHTML = "";

                // 1. Kutulardaki verileri topla
                const id = parseInt(document.getElementById("id")?.value || "0", 10) || 0;
                const title = document.getElementById("title")?.value.trim() || "";
                const slug = document.getElementById("slug")?.value.trim() || "";
                const authorName = document.getElementById("authorName")?.value.trim() || "";
                const summary = document.getElementById("summary")?.value.trim() || "";
                const content = document.getElementById("content")?.value.trim() || "";
                const publishedAtRaw = document.getElementById("publishedAt")?.value || "";
                const statusVal = document.getElementById("status")?.value || "0";

                // 2. Basit zorunlu alan kontrolü
                if (!title || !slug || !authorName || !summary || !content) {
                    alertContainer.innerHTML = `
                        <div class="alert alert-warning border-0 shadow-sm rounded-3 d-flex align-items-center mb-4">
                            <i class="bi bi-exclamation-triangle-fill fs-4 me-2"></i>
                            <div>Please fill in all required fields marked with (*).</div>
                        </div>
                    `;
                    return;
                }

                // 3. Butonu kilitle ve yükleniyor moduna al
                btnSave.disabled = true;
                submitSpinner.classList.remove("d-none");
                submitIcon.classList.add("d-none");
                submitText.textContent = "Saving...";

                // 4. Backend DTO'suna birebir eşleşen payload kolisi
                const payload = {
                    id: id,
                    title: title,
                    slug: slug,
                    authorName: authorName,
                    summary: summary,
                    content: content,
                    publishedAt: publishedAtRaw ? new Date(publishedAtRaw).toISOString() : null,
                    status: parseInt(statusVal, 10) || 0
                };

                // 5. Payload'ı doğrudan API'ye teslim et
                try {
                    await window.NewsClient.createNews(payload);

                    alertContainer.innerHTML = `
                        <div class="alert alert-success border-0 shadow-sm rounded-3 d-flex align-items-center mb-4">
                            <i class="bi bi-check-circle-fill fs-4 me-2"></i>
                            <div>Article saved successfully! Redirecting...</div>
                        </div>
                    `;

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1200);
                } 
                catch (err) {
                    console.error("Payload post error:", err);
                    alertContainer.innerHTML = `
                        <div class="alert alert-danger border-0 shadow-sm rounded-3 d-flex align-items-center mb-4">
                            <i class="bi bi-x-circle-fill fs-4 me-2"></i>
                            <div>${err.message || "Failed to save article."}</div>
                        </div>
                    `;

                    btnSave.disabled = false;
                    submitSpinner.classList.add("d-none");
                    submitIcon.classList.remove("d-none");
                    submitText.textContent = "Save Article";
                }
            });
        });
    </script>
</body>
</html>
